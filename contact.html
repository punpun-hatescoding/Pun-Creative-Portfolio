<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pun's Folio</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Rubik+Bubbles&family=VT323&family=UnifrakturMaguntia&display=swap"
      rel="stylesheet"/>
  </head>

  <body>
    <div id="npc-follower"><img src="images/cursor.png" alt="" /></div>
    <div class="sparkle"></div>
    <div class="container">
      <!-- Header -->
      <header>
        <a href="mainpage.html"><div class="logo">
          <img src="images/pun.png" alt="Pun's logo" />
        </div></a>
        <!-- Dropdown Menu -->
        <div class="dropdown-wrapper">
          <button class="dropdown-btn">Menu ▼</button>
          <nav class="nav dropdown-menu" id="site-navigation">
            <a href="about.html">🌟 About Me</a>
            <a href="works.html">🛠 Works</a>
            <a href="contact.html">📬 Contact</a>
          </nav>
        </div>
      </header>
<section id="contact" class="contact-section">
    <div class="letter-container">
        
        <div class="washi-tape"></div>

        <div class="stationery-paper">
            
            <div class="letter-header">
                <span class="stamp-icon">💌</span>
                <h2>Send a Note!</h2>
                <span class="stamp-icon">✨</span>
            </div>

            <div class="letter-body">
                
                <div class="form-group">
                    <label>To: Pun</label>
                    <div class="cute-divider"></div>
                </div>

                <div class="form-group">
                    <label>From:</label>
                    <input type="text" placeholder="Your Name / Email" class="cute-input">
                </div>

                <div class="form-group">
                    <label>Subject:</label>
                    <input type="text" placeholder="Let's collab!" class="cute-input">
                </div>

                <div class="message-group">
                    <textarea class="cute-textarea" placeholder="Write your magical message here..."></textarea>
                </div>

                <div class="letter-footer">
                    <button id="send-btn" class="heart-btn">
                        <span class="btn-icon">💖</span> Send it!
                    </button>
                    <div class="decor-sticker">🐱</div>
                </div>

            </div>
        </div>
        
        <div class="bg-decoration-1">🌸</div>
        <div class="bg-decoration-2">🍄</div>

    </div>
</section>
    </div>
    <script src="animate.js"></script>
  </body>
</html>
