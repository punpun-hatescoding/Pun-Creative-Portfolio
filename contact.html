  <body>

      <!-- Header -->

        <a href="index.html"><div class="logo">
          <img src="main-images/fat-cat.png" alt="Pun's logo"/>
        </div></a>
        <!-- Dropdown Menu -->

          <button class="dropdown-btn">Menu ▼</button>

<form action="https://formspree.io/f/mykyzjjp" method="POST" class="letter-container">
<section id="contact" class="contact-section">
    <div class="letter-container">
        
        <div class="washi-tape"></div>

        <div class="stationery-paper">
            
            <div class="letter-header">
                <span class="stamp-icon">💌</span>
                <h2>Leave a Note!</h2>
                <span class="stamp-icon">✨</span>
            </div>

            <div class="letter-body">
                
                <div class="form-group">
                    <label>To: Pun</label>
                    <div class="cute-divider"></div>
                </div>

                <div class="form-group">
                    <label>From:</label>
                    <input type="text" placeholder="Your Name / Email" class="cute-input">
                </div>

                <div class="form-group">
                    <label>Subject:</label>
                    <input type="text" placeholder="Let's collab!" class="cute-input">
                </div>

                <div class="message-group">
                    <textarea class="cute-textarea" placeholder="Write your message here..."></textarea>
                </div>

                <div class="letter-footer">
                    <button id="send-btn" class="heart-btn">
                        <span class="btn-icon">🩵</span>Send it!
                    </button>
                    <div class="decor-sticker">
                      <a href="https://www.instagram.com/nhoamnhoam.chocomint/" target="_blank"><img src="previews/instagram.png" alt="instagram"></a>
                      <a href="mailto:nguyennann123@gmail.com"><img src="previews/mail.png" style="transform: scale(1.3);" alt="gmail"></a>
                      <a href="https://vimeo.com/user252311436?fl=pp&fe=sh" target="_blank"><img src="previews/vimeo.png" alt="vimeo"></a>
                      <a href="https://www.linkedin.com/in/th%C3%BAy-an-nguy%E1%BB%85n-710629292/" target="_blank"><img src="previews/linkedin.png" style="transform: scale(1.2);" alt="linkedin"></a>
                    </div>
                </div>

            </div>
        </div>
        
        <div class="bg-decoration-1">🍄</div>
        <div class="bg-decoration-2">🍄</div>

    </div>
</section>
</form>
    </div>
