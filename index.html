    <style>
      /* Define CSS variables for easy adjustments. 
           Colors are sampled directly from your source image.
        */
      :root {
        --pattern-bg-color: #4a2521; /* The deep brown background */
        --pattern-dot-color: #46a19f; /* The teal/cyan dot color */

        /* Adjust sizes here to change the look pattern density.
               Desktop/Tablet default sizes:
            */
        --dot-radius: 4px; /* How big the dots are */
        --tile-size: 90px; /* The space between repeating dots */
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;

        /* 1. Set the main background color */
        background-color: var(--pattern-bg-color);

        /* 2. Create the pattern using two radial-gradient layers */
        background-image: 
                /* Layer 1: The dots sitting in the "gaps" (shifted) */ radial-gradient(
            circle,
            var(--pattern-dot-color) var(--dot-radius),
            transparent calc(var(--dot-radius) + 0.5px)
          ),
          /* Layer 2: The standard grid dots (corners) */
            radial-gradient(
              circle,
              var(--pattern-dot-color) var(--dot-radius),
              transparent calc(var(--dot-radius) + 0.5px)
            );

        /* 3. Define the size of the repeating square tile */
        background-size: var(--tile-size) var(--tile-size);

        /* 4. Position the layers.
               The first layer is shifted down and right by exactly half 
               the tile size to create the offset effect.
               The second layer starts at 0 0.
            */
        background-position: calc(var(--tile-size) / 2)
            calc(var(--tile-size) / 2),
          /* Position for Layer 1 */ 0 0; /* Position for Layer 2 */
      }

      /* --- RESPONSIVE TWEAKS --- */

      /* On smaller mobile devices, we slightly shrink the tile size 
           so the pattern doesn't look too sparse or empty. */
      @media (max-width: 600px) {
        :root {
          --dot-radius: 3.5px;
          --tile-size: 70px;
        }
      }
   header {
    /* Ensure header can grow if needed */
    min-height: 5rem;
    padding: 0.5rem 1rem;
    position: relative;
  }
  /* Optional: If the hamburger is too low, you can pull it up */
  .nav-toggle {
    margin-top: 0;
    transform: translateY(-5px); /* Pulls it up slightly */
  }

  .dropdown-wrapper {
    /* This keeps the wrapper small, fitting only the button */
    position: relative;
    align-items: flex-end;
    flex-direction: column;
    width: 100%;
    background-color: transparent;
    margin-left: 0; /* Reset left margin for mobile */
    z-index: 2000; /* Ensure it stays above other elements */
    overflow: visible !important;
  }

  /* SHOW the button */
  .dropdown-btn {
    display: block;
    background-color: var(--yellowgreen);
    color: var(--text-main);
    padding: 0.5rem 1rem;
    font-family: var(--font-family-base);
    font-size: clamp(1rem, 2vw, 1.5rem);
    border: none;
    cursor: pointer;
    border-radius: 10px;
    transition: background-color 0.3s ease;
    /* Width adjusted to look good next to logo */
    width: auto;
    min-width: 100px;
    text-align: center;
    align-items: center;
  }

  .dropdown-btn:hover {
    background-color: yellowgreen;
    font-size: clamp(1rem, 2vw, 1.5rem);
  }

  /* APPLY the Dropdown Logic */

  .dropdown-menu {
    position: absolute;
    min-width: 160px;
    max-width: 30vw;
    background-color: rgb(255, 128, 159);

    /* CLOSED STATE: */
    max-height: 0;
    opacity: 0;
    overflow: hidden; /* <--- CRITICAL: Hide content when closed */
    pointer-events: none;
    /* Transition settings */
    transition: max-height 0.3s ease, opacity 0.3s ease;
    z-index: 2001;
    border-radius: 10px;
    flex-direction: column;
    box-shadow: 0px 8px 16px rgba(57, 0, 0, 0.3);
  }

  /* OPEN STATE: */
  .dropdown-menu.open {
    max-height: 300px;
    opacity: 1;
    overflow: visible; /* <--- CRITICAL: Show content when open */
    pointer-events: auto;
    padding: 10px 0;
    z-index: 2001;
  }
  .dropdown-menu a {
    display: block;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  }
  .dropdown-menu a:last-child {
    border-bottom: none; /* Remove border from last item */
  }

  </style>
    
  </head>
