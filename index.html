<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pun's Folio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Audiowide&family=DotGothic16&family=DynaPuff:wght@400..700&family=Griffy&family=Irish+Grover&family=Jacquard+12&family=Jockey+One&family=Love+Ya+Like+A+Sister&family=Russo+One&family=UnifrakturMaguntia&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
    
   
header {
    background-color: transparent;
  }
  
  .nav-toggle {
    margin-top: 0;
    transform: translateY(-5px); /* Pulls it up slightly */
  }

  .dropdown-wrapper {
    /* This keeps the wrapper small, fitting only the button */
    position: relative;
    align-items: flex-end;
    flex-direction: column;
    width: 100%;
    background-color: transparent;
    margin-left: 0; /* Reset left margin for mobile */
    z-index: 2000; /* Ensure it stays above other elements */
    overflow: visible !important;
  }

  /* SHOW the button */
  .dropdown-btn {
    display: block;
    background-color: var(--yellowgreen);
    color: var(--text-main);
    font-size: 1.5rem;
    padding: 0.5rem 1rem;
    font-family: var(--font-family-base);
    cursor: pointer;
    border-radius: 10px;
    transition: background-color 0.3s ease;
    min-width: 100px;
    height: 50px;
    border: none;
    text-align: center;
    align-items: center;
  }
@media (max-width: 450px) {
    .dropdown-btn {
      min-width: 80px;
      font-size: 0.9rem;
      padding: 0.4rem 0.8rem;
      height: 40px;
    }
  }
  .dropdown-btn:hover {
    background-color: rgb(204, 255, 0);
  }

  /* APPLY the Dropdown Logic */

  .dropdown-menu {
    position: absolute;
    min-width: 150px;
    max-width: 20vw;
    background-color: var(--pink);
    /* CLOSED STATE: */
    max-height: 0;
    opacity: 0;
    overflow: hidden; /* <--- CRITICAL: Hide content when closed */
    pointer-events: none;
    /* Transition settings */
    transition: max-height 0.3s ease, opacity 0.3s ease;
    z-index: 2001;
    border-radius: 10px;
    flex-direction: column;
    box-shadow: 0px 8px 16px rgba(37, 0, 0, 0.3);
  }

  /* OPEN STATE: */
  .dropdown-menu.open {
    max-height: 200px;
    opacity: 1;
    overflow: visible; /* <--- CRITICAL: Show content when open */
    pointer-events: auto;
    padding: 1px 1px;
    z-index: 2001;
  }
  .dropdown-menu a {
    display: block;
    padding: 1rem 1rem;
    background-color: transparent;
    border-radius: 10px 10px 10px 10px;
  }
  .dropdown-menu a:hover {
    background-color: var(--yellowgreen);  
    color: var(--text-main);
  }
 
  </style>
    
  </head>

  <body>
    
    <div id="npc-follower"><img src="images/cursor.png" alt="" /></div>
    <div class="sparkle"></div>
    <div class="container">
      <!-- Header -->
       <header>
     <!-- Dropdown Menu -->
       <a href="index.html"><div class="logo">
          <img src="main-images/fat-cat.png" alt="Pun's logo" /></div>
      </a>
        <div class="dropdown-wrapper">
          <button class="dropdown-btn">Menu ▼</button>
          <nav class="nav dropdown-menu" id="site-navigation">
            <a href="about.html">🌟 About Me</a>
            <a href="works.html">🛠 Works</a>
            <a href="contact.html">📬 Contact</a>
          </nav>
          
        </div>
     
      </header>
      <!-- Main Title -->
      <div id="deco-buttons">
        <img id="red-btn" src="main-images/red-btn.png" alt="red button" />
        <img id="yellow-btn" src="main-images/yellow-btn.png" alt="yellow button" />
        <img id="green-btn" src="main-images/green-btn.png" alt="green button" />
      </div>
      <div id="title">
        <img
          id="welcome-to"
          src="main-images/welcome-to.png"
          alt="welcome to"
        />
        <img
          id="my-portfolio"
          src="main-images/my-portfolio.png"
          alt="my portfolio"
        />
      
      <div id="start-exit-buttons">
    
    
    <div id="lets-start"> 
        <p id="lets-start-text">Let's Start!</p>
        <a href="about.html"><img src="main-images/exit.png" alt="let's start"></a>
    </div>
</div>
    </div>

    <script src="animate.js"></script>
  </body>
  <!-- Main Title -->
</html>
